pipeline:
  name: Build Assignment
  identifier: Build_Assignment_1757001150914
  projectIdentifier: Demo
  orgIdentifier: default
  stages:
    - stage:
        name: Build Nginx
        identifier: Build_Nginx
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Semgrep
                  name: SAST
                  identifier: SAST
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: account.DockerReg
                    repo: linkon19/nginx
                    tags:
                      - Nginx
                    buildArgs:
                      NGINX_VERSION: <+stage.variables.nginx_version>
              - step:
                  type: AquaTrivy
                  name: AquaTrivy_1
                  identifier: AquaTrivy_1
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: container
                      detection: auto
                    advanced:
                      log:
                        level: debug
                    privileged: true
                    image:
                      type: docker_v2
                      tag: Nginx
                      access_id: linkon19
                      access_token: <+secrets.getValue("Docker-access-token")>
                      name: linkon19/nginx
                      domain: docker.io
          sharedPaths:
            - /var/run
        variables:
          - name: nginx_version
            type: String
            description: ""
            required: true
            value: <+input>.executionInput().default(1.25.3)
  properties:
    ci:
      codebase:
        connectorRef: Github
        repoName: Assignment
        build: <+input>
